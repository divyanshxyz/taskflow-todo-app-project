<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
</head>

<body>
    <div id="app-container">
        <aside id="sidebar">
            <h2>Projects</h2>
            <div id="project-list"></div>
            <form id="add-project-form">
                <input type="text" id="new-project-name" placeholder="New Project..." required>
                <button type="submit">+ Add</button>
            </form>
        </aside>

        <main id="main-content">
            <h2>Todos</h2>

            <form action="" id="add-todo-form">
                <input type="text" name="title" id="" placeholder="Title" required>
                <input type="text" name="description" placeholder="Description">
                <input type="date" name="dueDate">
                <label for="priority">Choose Priority: </label>
                <select type="tel" name="priority" placeholder="Priority" id="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
                <input type="text" name="notes" placeholder="Notes">
                <input type="text" name="checklist" placeholder="Checklist">
                <input type="checkbox" name="isCompleted" value="true">
                <button type="submit" id="add-todo-form-submit-btn">Add Todo</button>
            </form>

            <div id="todo-list"></div>
        </main>
    </div>

    <div id="edit-todo-modal" class="hide-edit-modal">
        <form action="" id="edit-todo-form">
            <input type="text" name="title" id="edit-title-in" placeholder="Title" required>
            <input type="text" name="description" id="edit-description-in" placeholder="Description">
            <input type="date" name="dueDate" id="edit-dueDate-in">
            <label for="priority">Choose Priority: </label>
            <select type="tel" name="priority" placeholder="Priority" id="edit-priority-in">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <input type="text" name="notes" id="edit-notes-in" placeholder="Notes">
            <input type="text" name="checklist" id="edit-checklist-in" placeholder="Checklist">
            <label for="edit-isComplete-in">Is Complete</label>
            <input type="checkbox" name="isCompleted" id="edit-isComplete-in" value="true">
            <button type="submit">Save Changes</button>
            <button type="button" id="close-edit-modal">Cancel</button>
        </form>

    </div>
    <div id="edit-project-modal" class="hide-edit-modal">
        <form id="edit-project-form">
            <input type="text" id="edit-project-name-in" name="projectName" required>
            <button type="submit">Save Name</button>
            <button type="button" id="close-edit-project-modal">Cancel</button>
        </form>
    </div>

</body>

</html>
